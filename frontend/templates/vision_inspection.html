  <body>

<script>
  const BACKEND_API = "{{ backend_api }}";
  const USERNAME = "{{ username }}";  // Get username from template
  const imageUpload = document.getElementById('image-upload');
  const imageToCrop = document.getElementById('image-to-crop');
  const imageCropSection = document.getElementById('image-crop-section');
  const completeCropButton = document.getElementById('complete-crop');
  const imageAlignSection = document.getElementById('image-align-section');
  const alignCanvas = document.getElementById('align-canvas');
  const processedImageSection = document.getElementById('processed-image-section');
  const processedImage = document.getElementById('processed-image');
  const cameraStreamSection = document.getElementById('camera-stream-section');
  const liveStream = document.getElementById('live-stream');
  const connectCameraButton = document.getElementById('connect-camera');
  const captureImageButton = document.getElementById('capture-image');
  const rotateLeftButton = document.getElementById('rotate-left');
  const rotateRightButton = document.getElementById('rotate-right');
  const submitImageButton = document.getElementById('submit-image');
  const saveImageButton = document.getElementById('save-image');
  const resultInputs = document.getElementById('result-inputs');
  const itemTypeSelect = document.getElementById('item_type');
  const pitchSelect = document.getElementById('pitch');
  const pitchSelectionGroup = document.getElementById('pitch-selection-group');
  
  let cropper;
  let alignContext = alignCanvas.getContext('2d');
  let croppedImage;
  let alignRotation = 0;
  let latestAlignedImageData = "";

  const alignActionButtons = [submitImageButton];

  function toggleVisibility(element, visible, displayType = 'inline-block') {
    if (!element) return;
    element.style.display = visible ? displayType : 'none';
  }

  function setAlignButtonsVisibility(visible) {
    alignActionButtons.forEach(btn => toggleVisibility(btn, visible));
  }

  function setCropButtonVisibility(visible) {
    toggleVisibility(completeCropButton, visible);
  }

  function setSaveButtonVisibility(visible) {
    toggleVisibility(saveImageButton, visible);
  }

  function setResultInputVisibility(visible) {
    toggleVisibility(resultInputs, visible, 'flex');
  }

  setCropButtonVisibility(false);
  setAlignButtonsVisibility(false);
  setSaveButtonVisibility(false);
  setResultInputVisibility(false);

  // Function to toggle pitch selection visibility based on item type
  function updatePitchSelectionVisibility() {
    const itemType = itemTypeSelect.value;
    // Show pitch selection for 03, 15, 18 types, hide for 32type
    if (itemType === "03type" || itemType === "15type" || itemType === "18type") {
      pitchSelectionGroup.style.display = "flex";
    } else {
      pitchSelectionGroup.style.display = "none";
    }
  }

  // Initialize pitch selection visibility on page load
  updatePitchSelectionVisibility();

  // Update pitch selection visibility when item type changes
  itemTypeSelect.addEventListener("change", updatePitchSelectionVisibility);

  // Image compression function
  function compressImage(file, maxWidthHeight, quality, callback) {
    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.src = e.target.result;
      
      img.onload = function() {
        const canvas = document.createElement('canvas');
        let width = img.width;
        let height = img.height;
        
        if (width > height && width > maxWidthHeight) {
          height *= maxWidthHeight / width;
          width = maxWidthHeight;
        } else if (height > maxWidthHeight) {
          width *= maxWidthHeight / height;
          height = maxWidthHeight;
        }
        
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        
        const dataUrl = canvas.toDataURL('image/jpeg', quality || 0.7);
        callback(dataUrl);
      };
    };
    reader.readAsDataURL(file);
  }

  // Helper function to submit image directly for processing
  function submitImageForProcessing(imageDataUrl, fromCameraCapture = false) {
    const itemType = document.querySelector('select[name="item_type"]').value;
    const pitch = (itemType === "03type" || itemType === "15type" || itemType === "18type") 
      ? document.querySelector('select[name="pitch"]').value 
      : "standard";
    latestAlignedImageData = imageDataUrl;

    // Hide crop and align sections
    imageCropSection.style.display = 'none';
    imageAlignSection.style.display = 'none';
    setCropButtonVisibility(false);
    setAlignButtonsVisibility(false);

    fetch(`${BACKEND_API}/`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        aligned_image: imageDataUrl,
        item_type: itemType,
        pitch: pitch
      })
    })
    .then(response => {
      if (!response.ok) {
        throw new Error(`HTTP error! status: ${response.status}`);
      }
      return response.json();
    })
    .then(data => {
      // Re-enable capture button if it was from camera
      if (fromCameraCapture) {
        captureImageButton.disabled = false;
        captureImageButton.textContent = "Capture Image";
      }
      
      if (data.error) {
        // Show error modal with specific message
        const errorMessage = data.error_message || "Fail to capture work guide and insertion guide";
        showErrorModal("❌ Capture Failed", errorMessage, fromCameraCapture);
      } else if (data.processed_image_url) {
        processedImage.src = `${BACKEND_API}${data.processed_image_url}`;
        processedImageSection.style.display = 'block';
        setSaveButtonVisibility(true);
        setResultInputVisibility(true);
      } else {
        // Show error modal
        showErrorModal("Failed to process image", "The image could not be processed. Please retake the image.", fromCameraCapture);
      }
    })
    .catch(error => {
      console.error("Error:", error);
      // Re-enable capture button if it was from camera
      if (fromCameraCapture) {
        captureImageButton.disabled = false;
        captureImageButton.textContent = "Capture Image";
      }
      // Show error modal
      showErrorModal("Processing Error", "An error occurred while processing the image. Please retake the image.", fromCameraCapture);
    });
  }

  // Function to show error modal
  function showErrorModal(title, message, fromCameraCapture = false) {
    document.getElementById("error-modal-title").textContent = title;
    document.getElementById("error-modal-message").textContent = message;
    document.getElementById("error-modal").setAttribute("data-from-camera", fromCameraCapture);
    document.getElementById("error-modal").style.display = "flex";
  }

  // Function to handle connect camera and capture image
  function handleConnectAndCapture() {
    const errorModal = document.getElementById("error-modal");
    
    // Hide error modal
    errorModal.style.display = "none";
    
    // Hide all image sections
    imageCropSection.style.display = "none";
    imageAlignSection.style.display = "none";
    processedImageSection.style.display = "none";
    setCropButtonVisibility(false);
    setAlignButtonsVisibility(false);
    setSaveButtonVisibility(false);
    setResultInputVisibility(false);
    
    // Reconnect camera and enable live mode
    fetch(`${BACKEND_API}/reconnect_camera`, { method: "POST" })
      .then(response => response.json())
      .then(data => {
        if (data.success) {
          liveStream.src = `${BACKEND_API}/video_feed`;
          cameraStreamSection.style.display = "block";
          captureImageButton.style.display = "block";
          captureImageButton.disabled = false;
          captureImageButton.textContent = "Capture Image";
          // Hide connect camera button since we're already connected
          connectCameraButton.style.display = "none";
        } else {
          alert("Failed to reconnect the camera. Please click 'Connect to Camera' manually.");
          connectCameraButton.style.display = "block";
        }
      })
      .catch(error => {
        console.error("Error reconnecting camera:", error);
        alert("Failed to reconnect the camera. Please click 'Connect to Camera' manually.");
        connectCameraButton.style.display = "block";
      });
  }

  // Upload and submit image directly for processing
  imageUpload.addEventListener("change", (event) => {
    processedImageSection.style.display = "none";
    processedImage.src = "";
    setSaveButtonVisibility(false);
    setCropButtonVisibility(false);
    setAlignButtonsVisibility(false);
    setResultInputVisibility(false);
    imageCropSection.style.display = "none";
    imageAlignSection.style.display = "none";
    
    const file = event.target.files[0];
    if (file) {
      compressImage(file, 1920, 0.8, function(compressedDataUrl) {
        // Submit directly for processing, skipping crop and align
        submitImageForProcessing(compressedDataUrl);
      });
    }
  });

  // Connect to Camera
  connectCameraButton.addEventListener('click', () => {
    fetch(`${BACKEND_API}/reconnect_camera`, { method: "POST" })
      .then(response => response.json())
      .then(data => {
        if (data.success) {
          liveStream.src = `${BACKEND_API}/video_feed`;
          cameraStreamSection.style.display = "block";
          // Show capture image button when camera is connected
          captureImageButton.style.display = "block";
          // Hide connect camera button after successful connection
          connectCameraButton.style.display = "none";
        } else {
          alert("Failed to reconnect the camera.");
        }
      })
      .catch(error => console.error("Error reconnecting camera:", error));
  });

  // Capture Image and submit directly for processing
  captureImageButton.addEventListener("click", () => {
    // Disable button to prevent double-clicks
    captureImageButton.disabled = true;
    captureImageButton.textContent = "Capturing...";
    
    fetch(`${BACKEND_API}/capture`, { method: "POST" })
      .then(response => {
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        return response.json();
      })
      .then(data => {
        console.log("Capture response:", data);
        
        if (data.success && data.proceed_to_crop) {
          // Hide camera stream section after capture
          cameraStreamSection.style.display = "none";
          liveStream.src = "";
          // Hide capture button when camera stream is hidden
          captureImageButton.style.display = "none";
          
          // Add a small delay to ensure file is ready
          setTimeout(() => {
            const timestamp = Date.now();
            const capturedImagePath = `${BACKEND_API}${data.image_path}?t=${timestamp}`;
            console.log("Loading image from:", capturedImagePath);
            
            const capturedImg = new Image();
            capturedImg.crossOrigin = "anonymous";
            
            capturedImg.onload = () => {
              console.log("Image loaded successfully, size:", capturedImg.width, "x", capturedImg.height);
              
              const resizeCanvas = document.createElement("canvas");
              const resizeContext = resizeCanvas.getContext("2d");
              const standardWidth = 1920;
              const standardHeight = 1080;
              resizeCanvas.width = standardWidth;
              resizeCanvas.height = standardHeight;

              resizeContext.drawImage(capturedImg, 0, 0, standardWidth, standardHeight);

              // Store the image data for later use
              croppedImage = resizeCanvas;
              alignRotation = 0;
              
              // Get the aligned image data
              const alignedImageData = resizeCanvas.toDataURL('image/png');
              latestAlignedImageData = alignedImageData;
              
              // Automatically submit for processing
              captureImageButton.textContent = "Processing...";
              submitImageForProcessing(alignedImageData, true); // true = from camera capture
            };
            
            capturedImg.onerror = (error) => {
              console.error("Failed to load image:", error);
              captureImageButton.disabled = false;
              captureImageButton.textContent = "Capture Image";
              showErrorModal("Failed to Load Image", "Failed to load the captured image. Please retake the image.", true);
            };
            
            capturedImg.src = capturedImagePath;
          }, 200); // 200ms delay to ensure file is ready
        } else {
          captureImageButton.disabled = false;
          captureImageButton.textContent = "Capture Image";
          showErrorModal("Capture Failed", "Failed to capture image. Please try again.", true);
        }
      })
      .catch(error => {
        console.error("Capture error:", error);
        captureImageButton.disabled = false;
        captureImageButton.textContent = "Capture Image";
        showErrorModal("Capture Error", "An error occurred during image capture: " + error.message, true);
      });
  });

  // Complete cropping
  completeCropButton.addEventListener('click', () => {
    if (!cropper) {
      alert("Cropper not initialized. Please try again.");
      return;
    }

    croppedImage = cropper.getCroppedCanvas({
      width: imageToCrop.naturalWidth,
      height: imageToCrop.naturalHeight,
    });

    cropper.destroy();
    cropper = null;

    imageCropSection.style.display = 'none';
    setCropButtonVisibility(false);

    alignCanvas.width = croppedImage.width;
    alignCanvas.height = croppedImage.height;

    alignContext.drawImage(croppedImage, 0, 0);

    imageAlignSection.style.display = 'block';
    setAlignButtonsVisibility(true);
  });

  // Rotate left by 2 degrees
  rotateLeftButton.addEventListener('click', () => {
    alignRotation -= 2;
    applyRotation();
  });

  // Rotate right by 2 degrees
  rotateRightButton.addEventListener('click', () => {
    alignRotation += 2;
    applyRotation();
  });

  // Apply rotation
  function applyRotation() {
    const radians = (alignRotation * Math.PI) / 180;
    alignContext.clearRect(0, 0, alignCanvas.width, alignCanvas.height);

    alignContext.save();
    alignContext.translate(alignCanvas.width / 2, alignCanvas.height / 2);
    alignContext.rotate(radians);
    alignContext.drawImage(croppedImage, -croppedImage.width / 2, -croppedImage.height / 2);
    alignContext.restore();
  }

  // Submit aligned image
  submitImageButton.addEventListener('click', () => {
    const alignedImage = alignCanvas.toDataURL();
    latestAlignedImageData = alignedImage;
    const itemType = document.querySelector('select[name="item_type"]').value;
    const pitch = (itemType === "03type" || itemType === "15type" || itemType === "18type") 
      ? document.querySelector('select[name="pitch"]').value 
      : "standard";

    fetch(`${BACKEND_API}/`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        aligned_image: alignedImage,
        item_type: itemType,
        pitch: pitch
      })
    })
    .then(response => response.json())
    .then(data => {
      if (data.error) {
        // Show error modal with specific message
        const errorMessage = data.error_message || "Fail to capture work guide and insertion guide";
        showErrorModal("❌ Capture Failed", errorMessage, false);
      } else if (data.processed_image_url) {
        processedImage.src = `${BACKEND_API}${data.processed_image_url}`;
        imageAlignSection.style.display = 'none';
        setAlignButtonsVisibility(false);
        processedImageSection.style.display = 'block';
        setSaveButtonVisibility(true);
        setResultInputVisibility(true);
      } else {
        showErrorModal("Processing Failed", "Error processing the image. Please try again.", false);
      }
    })
    .catch(error => {
      console.error("Error:", error);
      showErrorModal("Processing Error", "An error occurred while processing the image. Please try again.", false);
    });
  });


  // Function to format machine number with "ct" prefix
  function formatMachineNumber(input) {
    let value = input.trim();
    // Remove any existing "ct" prefix if user typed it
    if (value.toLowerCase().startsWith("ct")) {
      value = value.substring(2).trim();
    }
    // Remove any non-digit characters
    value = value.replace(/\D/g, '');
    // Ensure it's exactly 3 digits
    if (value.length > 0 && value.length < 3) {
      value = value.padStart(3, '0');
    }
    // Add "ct" prefix
    if (value.length > 0) {
      return "ct" + value;
    }
    return value;
  }

  // Machine number input handler - automatically add "ct" prefix
  const machineNumberInput = document.getElementById("machineNumber");
  const machineNumberPreview = document.getElementById("machineNumberPreview");
  
  function updateMachineNumberPreview() {
    const value = machineNumberInput.value.trim();
    if (value) {
      const formatted = formatMachineNumber(value);
      if (formatted.length === 5) {
        machineNumberPreview.textContent = formatted.toUpperCase();
        machineNumberPreview.style.color = "#4CAF50"; // Green when valid
      } else {
        machineNumberPreview.textContent = "ct" + value.padStart(3, '-');
        machineNumberPreview.style.color = "#E0E0E0";
      }
    } else {
      machineNumberPreview.textContent = "ct---";
      machineNumberPreview.style.color = "#E0E0E0";
    }
  }
  
  machineNumberInput.addEventListener("input", (e) => {
    let value = e.target.value;
    // Remove any non-digit characters
    value = value.replace(/\D/g, '');
    // Limit to 3 digits
    if (value.length > 3) {
      value = value.substring(0, 3);
    }
    e.target.value = value;
    updateMachineNumberPreview();
  });

  machineNumberInput.addEventListener("blur", (e) => {
    let value = e.target.value.trim();
    // If user typed something, ensure it's 3 digits
    if (value && value.length < 3) {
      // Pad with zeros if less than 3 digits
      value = value.padStart(3, '0');
      e.target.value = value;
      updateMachineNumberPreview();
    }
  });

  // Save image
  document.getElementById("save-image").addEventListener("click", () => {
    const machineNumberRaw = document.getElementById("machineNumber").value;
    const humanJudgement = document.getElementById("humanJudgement").value;

    if (!machineNumberRaw) {
      alert("Machine number is required to save the image.");
      return;
    }

    // Format machine number with "ct" prefix
    const machineNumber = formatMachineNumber(machineNumberRaw);
    
    // Validate format (ct + 3 digits)
    if (machineNumber.length !== 5 || !machineNumber.startsWith("ct") || !/^ct\d{3}$/.test(machineNumber)) {
      alert("Invalid machine number format. Please enter 3 digits (e.g., 612).");
      return;
    }

    if (!humanJudgement) {
      alert("Human Judgement is required to save the image.");
      return;
    }

    const imgElement = document.getElementById("processed-image");
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.src = imgElement.src;

    img.onload = () => {
      const tempCanvas = document.createElement("canvas");
      tempCanvas.width = img.width;
      tempCanvas.height = img.height;

      const ctx = tempCanvas.getContext("2d");
      ctx.drawImage(img, 0, 0);

      const base64Image = tempCanvas.toDataURL("image/png");

      fetch(`${BACKEND_API}/save-image`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          image_url: base64Image,
          machine_number: machineNumber.toLowerCase(),
          username: USERNAME,
          human_judgement: humanJudgement
        })
      })
      .then(response => response.json())
      .then(data => {
        if (data.success) {
          alert("✅ Image saved successfully!");
          // Reset form
          document.getElementById("machineNumber").value = "";
          document.getElementById("humanJudgement").value = "";
          processedImageSection.style.display = "none";
          setSaveButtonVisibility(false);
          setResultInputVisibility(false);
          imageAlignSection.style.display = "none";
          setAlignButtonsVisibility(false);
          // Re-enable connect camera button after successful save
          connectCameraButton.style.display = "block";
        } else {
          alert("❌ Failed to save image.");
        }
      })
      .catch(error => {
        console.error("Save error:", error);
        alert("❌ Error occurred while saving the image.");
      });
    };

    img.onerror = () => {
      alert("❌ Failed to load image for saving.");
    };
  });

  // Drawer toggle functionality
  document.addEventListener('DOMContentLoaded', function() {
    const drawer = document.querySelector('.mdl-layout__drawer');
    const toggleBtn = document.getElementById('toggleDrawerBtn');
    const toggleIcon = document.getElementById('toggleDrawerIcon');

    let minimized = false;

    if (localStorage.getItem('drawerMinimized') === 'true') {
      minimized = true;
      drawer.classList.add('minimized');
      document.body.classList.add('drawer-minimized');
      toggleIcon.textContent = 'chevron_right';
    }

    toggleBtn.addEventListener('click', function() {
      minimized = !minimized;
      drawer.classList.toggle('minimized', minimized);
      document.body.classList.toggle('drawer-minimized', minimized);
      toggleIcon.textContent = minimized ? 'chevron_right' : 'chevron_left';
      localStorage.setItem('drawerMinimized', minimized);
    });

    componentHandler.upgradeDom();
  });
</script>
</body>
</html>
